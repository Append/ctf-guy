name: Secret Scan

on: [push, pull_request]

permissions:
  contents: read

jobs:
  titus:
    runs-on: ubuntu-latest
    env:
      # Pinned to a reviewed commit. Building an unpinned default branch would
      # execute whatever upstream happens to be at run time. Bumping this is a
      # supply-chain change: review the diff before moving it.
      TITUS_REF: ecab09268ccbe08a5cbb324339c07c8e42b3e090
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # full history so --git can walk every commit
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Exact patch, not "1.25". The pinned titus commit's go.mod requires
          # >= 1.25.8, but a floating minor still picks the newest patch at run
          # time: two runs of the same commit built with 1.25.13 and 1.25.14
          # minutes apart. Pinning TITUS_REF freezes the source; this freezes the
          # compiler, so the scanner binary is reproducible.
          #
          # This was "1.24", which only appeared to work because setup-go v5
          # leaves GOTOOLCHAIN=auto and Go silently downloaded 1.25.8 mid-build.
          # Newer setup-go sets GOTOOLCHAIN=local, turning that into a hard error.
          #
          # Nothing bumps this automatically -- Dependabot does not track
          # setup-go's go-version. Review it when bumping TITUS_REF, and on Go
          # security releases.
          go-version: "1.25.14"
      - name: Build titus (pinned)
        run: |
          mkdir -p /tmp/titus && cd /tmp/titus
          git init -q
          git remote add origin https://github.com/praetorian-inc/titus
          git fetch -q --depth 1 origin "$TITUS_REF"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TITUS_REF"
          make build-pure
      - name: Scan working tree and history
        run: |
          # .titusignore scopes this to hand-authored code and infra. Solver
          # output (challenges/, archive/, solvers/patterns/) is excluded: it is
          # expected to contain exploit code, challenge credentials, and flags,
          # and scanning it buries real findings under hundreds of intended ones.
          # deploy/ and scripts/ stay in scope — both real secrets found during
          # release prep lived there, not in bot/.
          /tmp/titus/dist/titus scan . --ignore .titusignore --output /tmp/tree.ds
          /tmp/titus/dist/titus scan --git . --ignore .titusignore --output /tmp/hist.ds
