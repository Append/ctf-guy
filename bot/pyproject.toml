[project]
name = "ctf-bot"
version = "0.1.0"
description = "Discord CTF solver bot for ctf-guy"
requires-python = ">=3.12"
dependencies = [
    # Imported directly in run.py for the challenge file server; do not rely
    # on discord.py to supply it transitively.
    "aiohttp>=3.14.2",
    "discord.py>=2.3",
    "openai>=1.0",
    "httpx",
    "python-dotenv",
    "playwright",
]

[project.optional-dependencies]
# ruff is pinned: CI lint resolves its version from this file, so an
# unconstrained spec lets a new ruff release fail main with no code change.
dev = ["ruff==0.16.5", "black", "pytest", "pytest-asyncio"]
# Only needed if GHIDRA_MCP_ENABLED=true. The server is spawned out-of-process
# via `uvx pyghidra-mcp` and never imported here, so it stays out of the default
# install — it drags in chromadb, which currently has unfixed advisories.
ghidra = ["pyghidra-mcp"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["ai", "commands", "db", "discord_ui", "platforms", "ctfd", "events", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
