[project]
name = "ctf-bot"
version = "0.1.0"
description = "Discord CTF solver bot for ctf-guy"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.3",
    "openai>=1.0",
    "httpx",
    "python-dotenv",
    "playwright",
    "pyghidra-mcp",
]

[project.optional-dependencies]
dev = ["ruff", "black", "pytest", "pytest-asyncio"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["ai", "commands", "db", "discord_ui", "platforms", "ctfd", "events", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
