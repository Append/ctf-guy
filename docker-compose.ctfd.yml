services:
  ctfd:
    image: ctfd/ctfd:3.8.8@sha256:07cc9788d58b2a18ea4dc2103ff385c053ffc506f57d0c769a99387849aedd01
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - DATABASE_URL=sqlite:////opt/CTFd/CTFd/ctfd.db
      - SECRET_KEY=testing-secret-key-do-not-use-in-prod
      - UPLOAD_FOLDER=/opt/CTFd/CTFd/uploads
    volumes:
      - ctfd-data:/opt/CTFd/CTFd
    restart: unless-stopped

volumes:
  ctfd-data:
