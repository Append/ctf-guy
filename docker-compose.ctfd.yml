services:
  ctfd:
    image: ctfd/ctfd:3.8.9@sha256:84aff1e50b6a6f931b5da90c6f5b7c623ba4583217a9b00e9d4c1b7c53b9739f
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - DATABASE_URL=sqlite:////opt/CTFd/CTFd/ctfd.db
      - SECRET_KEY=testing-secret-key-do-not-use-in-prod
      - UPLOAD_FOLDER=/opt/CTFd/CTFd/uploads
    volumes:
      - ctfd-data:/opt/CTFd/CTFd
    restart: unless-stopped

volumes:
  ctfd-data:
